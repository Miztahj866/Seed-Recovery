[package]
name = "seed-recovery-tool"
version = "0.1.0"
description = "Local, offline BIP39 seed phrase recovery tool"
edition = "2021"
rust-version = "1.70"

# See docs/BUILD.md for how to produce a reproducible build from this manifest.

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
unicode-normalization = "0.1"
zeroize = { version = "1.7", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.21"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Deterministic, reproducible-build-friendly release settings.
panic = "abort"
codegen-units = 1
lto = true
strip = true
