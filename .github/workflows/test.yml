name: Test

# Runs on every push and every pull request, across all three major OSes.
# This is the actual cross-platform verification for this project — more
# trustworthy than any single contributor's machine, since the environment
# itself (exact OS image, exact toolchain versions) is visible and auditable
# to anyone reading this file.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  python-tests:
    name: Python core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run official BIP39 test vectors (Python)
        run: python3 tests/test_vectors.py

  rust-tests:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('gui/src-tauri/Cargo.lock') }}

      - name: Install Linux GUI system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
	  sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev libjavascriptcoregtk-4.1-dev

      - name: Run official BIP39 test vectors (Rust)
        working-directory: gui/src-tauri
        run: cargo test --verbose

  frontend-syntax:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate tauri.conf.json and package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('gui/src-tauri/tauri.conf.json'))" && echo "tauri.conf.json OK"
          node -e "JSON.parse(require('fs').readFileSync('gui/package.json'))" && echo "package.json OK"

      - name: Check main.js syntax
        run: node --check gui/src/main.js
